# MQTT (BMS / VCU path — must match CsmsMqttClient + Makefile verify-csms-response)
mp.messaging.connector.smallrye-mqtt.host=localhost
mp.messaging.connector.smallrye-mqtt.port=1883
mp.messaging.connector.smallrye-mqtt.client-id=solar-csms

mp.messaging.incoming.vehicle-location-request.connector=smallrye-mqtt
mp.messaging.incoming.vehicle-location-request.topic=vehicles/+/request/location
mp.messaging.incoming.vehicle-location-request.qos=1

mp.messaging.outgoing.station-location-response.connector=smallrye-mqtt
mp.messaging.outgoing.station-location-response.qos=1

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=csms
quarkus.datasource.password=csms
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/csmsdb
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true

# OCPP @OnMessage must not run JTA on the Vert.x event loop (LocationProvisioningService, StationService).
quarkus.websocket.dispatch-to-worker=true
