# =============================================================================
# Solar CSMS — Application Configuration
# =============================================================================

# --- MQTT broker (SmallRye connector defaults) ---
mp.messaging.connector.smallrye-mqtt.host=localhost
mp.messaging.connector.smallrye-mqtt.port=1883
mp.messaging.connector.smallrye-mqtt.client-id=solar-csms

# --- Inbound: driver location requests (wildcard topic) ---
mp.messaging.incoming.driver-location-request.connector=smallrye-mqtt
mp.messaging.incoming.driver-location-request.topic=drivers/+/request/location
mp.messaging.incoming.driver-location-request.qos=1

# --- Outbound: static channel (dynamic publishes use MqttClient directly) ---
mp.messaging.outgoing.station-location-response.connector=smallrye-mqtt
mp.messaging.outgoing.station-location-response.topic=stations/available/broadcast
mp.messaging.outgoing.station-location-response.qos=1

# --- PostgreSQL + Hibernate ORM ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=csms
quarkus.datasource.password=csms
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/csmsdb
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.dialect=org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
quarkus.flyway.migrate-at-start=true

# --- JVM (dev/run): Woodstox StAX — avoids com.bea.xml.stream.* FactoryConfigurationError on Java 22+ ---
quarkus.jvm.args=-Djavax.xml.stream.XMLInputFactory=com.ctc.wstx.stax.WstxInputFactory -Djavax.xml.stream.XMLOutputFactory=com.ctc.wstx.stax.WstxOutputFactory -Djavax.xml.stream.XMLEventFactory=com.ctc.wstx.stax.WstxEventFactory --add-opens=java.base/java.lang=ALL-UNNAMED

# --- OCPP WebSocket ---
quarkus.websocket.dispatch-to-worker=true

# --- OpenTelemetry tracing ---
quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
quarkus.otel.traces.enabled=true

# --- Application defaults ---
app.location.default-radius-m=50000

# --- Container image (enable for docker-compose: -Dquarkus.container-image.build=true) ---
quarkus.container-image.build=false
quarkus.container-image.name=solar-csms
