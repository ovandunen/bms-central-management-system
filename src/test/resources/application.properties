# Default @QuarkusTest: in-memory H2 + Haversine fallback (no Docker required)
quarkus.arc.async-observer-methods-enabled=true
quarkus.datasource.devservices.enabled=false
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:csms-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.flyway.enabled=false
quarkus.flyway.migrate-at-start=false
quarkus.websocket.dispatch-to-worker=true

ki.service.url=http://localhost:8090
