# Tests use docker compose: postgres + mosquitto (or localhost when run on host)
quarkus.datasource.devservices.enabled=false
mp.messaging.connector.smallrye-mqtt.host=localhost
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/csmsdb
quarkus.datasource.username=csms
quarkus.datasource.password=csms
quarkus.hibernate-orm.dialect=org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.flyway.migrate-at-start=false
