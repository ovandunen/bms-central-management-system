# Overrides main config for all @QuarkusTest runs (no Docker required)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:csms;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.flyway.migrate-at-start=false

# PostGIS integration profile (LocationQueryServiceTest)
%postgis-test.quarkus.datasource.db-kind=postgresql
%postgis-test.quarkus.datasource.devservices.enabled=true
%postgis-test.quarkus.datasource.devservices.image-name=postgis/postgis:16-3.4
%postgis-test.quarkus.hibernate-orm.dialect=org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
