services:
  postgres:
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: csms
      POSTGRES_PASSWORD: csms
      POSTGRES_DB: csmsdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csms -d csmsdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -i healthcheck -W 3"]
      interval: 5s
      timeout: 5s
      retries: 5

  test:
    image: eclipse-temurin:21-jdk-jammy
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/csmsdb
      MP_MESSAGING_CONNECTOR_SMALLRYE_MQTT_HOST: mosquitto
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    command: ["./mvnw", "-B", "test"]

  csms:
    # Requires: ./mvnw package -DskipTests  (creates target/quarkus-app/)
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "8085:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/csmsdb
      MP_MESSAGING_CONNECTOR_SMALLRYE_MQTT_HOST: mosquitto
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4317
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

volumes:
  pgdata:
